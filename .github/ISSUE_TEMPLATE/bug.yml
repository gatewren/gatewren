name: Anomalie
description: Quelque chose ne fonctionne pas comme prévu.
labels: [anomalie]
body:
  - type: markdown
    attributes:
      value: N'incluez aucune donnée sensible (clé, licence, mot de passe, journal complet).
  - type: input
    id: version
    attributes:
      label: Version
      description: Résultat de « docker compose exec keystile keystile version »
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu et résultat obtenu
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Extrait de journal
      render: text
